<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Page</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
        }
        li {
            font-size: 2em;
            text-transform: uppercase;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <ul>
        <li>Jonil de Morais</li>
        <li>Maria de Jesus</li>
        <li>Shrek Reks</li>
    </ul>
</body>
</html>
